name: Release

on:
  push:
    branches:
      - main

# release-please opens/updates a release PR, so it needs PR write access in
# addition to contents. The repo setting "Allow GitHub Actions to create and
# approve pull requests" (Settings -> Actions -> General) must also be enabled.
permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      # googleapis/release-please-action is the maintained home of the action
      # (google-github-actions/release-please-action is deprecated). v4 does
      # not accept package-name/extra-files inputs; component naming comes
      # from include-component-in-tag and monorepo manifests if needed.
      - uses: googleapis/release-please-action@v4
        with:
          release-type: node
