name: PR checks

on:
  pull_request:
    branches:
      - main
      - master
    paths:
      - 'server/**'
      - 'web/**'
      - 'packages/**'
      - 'mcp/**'
      - 'contract/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.eslintrc.cjs'
      - 'prettier.config.js'
  push:
    branches:
      - main
    paths:
      - 'server/**'
      - 'web/**'
      - 'packages/**'
      - 'mcp/**'
      - 'contract/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.eslintrc.cjs'
      - 'prettier.config.js'

jobs:
  node-ci:
    name: Typecheck, build, lint, and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Enable corepack before setup-node so the pnpm version pinned in
      # package.json's "packageManager" field is on PATH for the pnpm cache.
      - name: Enable corepack
        run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Lint (eslint)
        run: pnpm lint
      - name: Format check (prettier)
        run: pnpm run format:check
      - name: Build registry-client
        run: pnpm run build:registry-client
      - name: Typecheck server
        run: pnpm --filter @mindbox/server typecheck
      - name: Build server
        run: pnpm --filter @mindbox/server build
      - name: Build web
        run: pnpm --filter @mindbox/web build
      # Root "pnpm test" covers registry-client + server + web, but NOT mcp.
      - name: Test registry-client, server, and web
        run: pnpm test
      - name: Test mcp
        run: pnpm --filter @mindbox/mcp test

  contract-ci:
    name: Contract formatting, lint, and tests
    runs-on: ubuntu-latest
    needs: node-ci
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            contract/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('contract/Cargo.toml', 'contract/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - run: cd contract && cargo fmt --all -- --check
      - run: cd contract && cargo clippy --all-targets --all-features -- -D warnings
      - run: cd contract && cargo test
